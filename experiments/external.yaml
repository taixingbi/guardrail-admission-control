name: external_replay
mode: transfer
tau: 0.50
retune: false
g_light: us.amazon.nova-micro-v1:0
sets:
  - {id: xstest, labels: native, file: data/external/xstest_prompts.csv}
  - {id: wildguardtest, labels: native, file: data/external/wildguardtest.jsonl}
command: python scripts/run_external.py
output: results/external/
note: Do not retune tau. Skip WildGuardTest if the jsonl is absent (HF gated).
