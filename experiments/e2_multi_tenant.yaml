name: e2_multi_tenant
experiment: E2
mode: open_loop
strong_demand_frac_of_rg: 1.3
r_gateway_rps: 3.01
rg_rps: 0.4
duration_s: 35
policies: [always_strong, risk_only, load_aware, proposed]
ab_mix:
  - [0.90, 0.10]
  - [0.70, 0.30]
  - [0.50, 0.50]
  - [0.30, 0.70]
tenants:
  A: {tau: 0.75, slo_ms: 600, reserved_share: 0.0}
  B: {tau: 0.40, slo_ms: 800, reserved_share: 0.4}
command: python scripts/run_e2.py
output: results/e2/
note: Proposed is the only policy with Tenant B reserved share.

