name: e2_multi_tenant
experiment: E2
mode: open_loop
strong_demand_frac_of_bg: 1.3
r_gateway_rps: 3.01
bg_rps: 0.4
duration_s: 120
reps: 5
q_source: frozen_g_light
mid_q_frac: 0.25
b_unsafe_p: 0.50
policies: [always_strong, risk_only, load_aware, proposed]
ab_mix:
  - [0.90, 0.10]
  - [0.70, 0.30]
  - [0.50, 0.50]
  - [0.30, 0.70]
tenants:
  A: {tau: 0.75, slo_ms: 600, reserved_share: 0.0}
  B: {tau: 0.40, slo_ms: 800, reserved_share: 0.4}
command: python3 scripts/run_e2.py
output: results/e2/
note: Bg is a gateway safety budget. Formal q is minilm-l12-h384 (not laptop MiniLM). A/B thresholds diverge on 0.40≤q<0.75.
